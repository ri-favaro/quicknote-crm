[changelog]
header = """
# Changelog

Todas as mudanças relevantes deste projeto são documentadas neste arquivo.

O formato segue [Keep a Changelog](https://keepachangelog.com/pt-BR/1.1.0/) e o versionamento segue [Semantic Versioning](https://semver.org/lang/pt-BR/).\n
"""
body = """
{% if commits %}\
{% if version %}\
    ## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
    ## [Unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
    ### {{ group | striptags | trim }}
    {% for commit in commits %}
        - {% if commit.scope %}**{{ commit.scope }}:** {% endif %}\
            {% if commit.breaking %}[**breaking**] {% endif %}\
            {{ commit.message | upper_first }} ([{{ commit.id | truncate(length=7, end="") }}](https://github.com/ri-favaro/quicknote-crm/commit/{{ commit.id }}))\
    {% endfor %}
{% endfor %}\n
{% endif %}\
"""
footer = ""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
commit_preprocessors = [
  { pattern = '\(#([0-9]+)\)', replace = "([#$1](https://github.com/ri-favaro/quicknote-crm/issues/$1))" },
]
commit_parsers = [
  { message = "^Merge pull request", skip = true },
  { message = "^Merge branch", skip = true },
  { message = "^feat", group = "<!-- 0 -->Recursos" },
  { message = "^fix", group = "<!-- 1 -->Correções" },
  { message = "^style", group = "<!-- 2 -->Visual / UI" },
  { message = "^refactor", group = "<!-- 3 -->Refatoração" },
  { message = "^perf", group = "<!-- 4 -->Performance" },
  { message = "^docs", group = "<!-- 5 -->Documentação" },
  { message = "^test", group = "<!-- 6 -->Testes" },
  { message = "^chore\\(.*test.*\\)", group = "<!-- 6 -->Testes" },
  { message = "^(ci|build)", group = "<!-- 7 -->Build & CI" },
  { message = "^chore\\(.*(build|ci|release|deps).*\\)", group = "<!-- 7 -->Build & CI" },
  { message = "^chore", skip = true },
]
protect_breaking_commits = false
filter_commits = true
tag_pattern = "v[0-9].*"
sort_commits = "newest"