name: Release

permissions:
  contents: read

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag da release de teste (opcional; padrão usa v<version> do tauri.conf.json)'
        required: false
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  create-release:
    name: Create draft release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      release_id: ${{ steps.release.outputs.release_id }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create or reuse draft release
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_TAG: ${{ inputs.tag_name }}
        run: |
          set -euo pipefail

          if [ -n "$INPUT_TAG" ]; then
            TAG="$INPUT_TAG"
          elif [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            TAG="$GITHUB_REF_NAME"
          else
            VERSION="$(jq -r '.version' src-tauri/tauri.conf.json)"
            TAG="v${VERSION}"
          fi

          if ! [[ "$TAG" =~ ^v[0-9A-Za-z._-]+$ ]]; then
            echo "Tag inválida: ${TAG}. Use o formato semântico começando com 'v' (ex.: v0.1.0)." >&2
            exit 1
          fi

          EXISTING_ID="$(gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=30" \
            | jq -r --arg tag "$TAG" '.[] | select(.tag_name == $tag and .draft == true) | .id' \
            | head -n 1 || true)"

          if [ -n "$EXISTING_ID" ]; then
            RELEASE_ID="$EXISTING_ID"
          else
            BODY="$(printf '%s\n' \
              '## QuickNote CRM' \
              '' \
              'Instaladores e executáveis gerados automaticamente para **Windows**, **macOS** e **Linux**.' \
              '' \
              '### Downloads' \
              '- **Windows:** `.msi` ou `.exe` (instalador NSIS)' \
              '- **macOS:** `.dmg` (`aarch64` para Apple Silicon / `x64` para Intel)' \
              '- **Linux:** `.AppImage` ou `.deb`' \
              '' \
              '> **Aviso (binários sem code signing):** nesta versão os instaladores ainda não possuem assinatura digital. No Windows, use **Mais informações → Executar assim mesmo** no SmartScreen; no macOS, clique com o botão direito em **QuickNote CRM.app → Abrir** ou libere em **Ajustes do Sistema → Privacidade e Segurança**.')"

            RELEASE_ID="$(gh api --method POST "repos/${GITHUB_REPOSITORY}/releases" \
              -f tag_name="$TAG" \
              -f target_commitish="$GITHUB_SHA" \
              -f name="QuickNote CRM ${TAG}" \
              -f body="$BODY" \
              -F draft=true \
              -F prerelease=false \
              --jq '.id')"
          fi

          echo "release_id=${RELEASE_ID}" >> "$GITHUB_OUTPUT"
          echo "tag_name=${TAG}" >> "$GITHUB_OUTPUT"

  build-tauri:
    name: Build & upload (${{ matrix.label }})
    needs: create-release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: windows-x64
            platform: windows-latest
            rust_target: ''
            args: ''
          - label: macos-aarch64
            platform: macos-latest
            rust_target: aarch64-apple-darwin
            args: '--target aarch64-apple-darwin'
          - label: macos-x64
            platform: macos-latest
            rust_target: x86_64-apple-darwin
            args: '--target x86_64-apple-darwin'
          - label: linux-x64
            platform: ubuntu-22.04
            rust_target: ''
            args: ''
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux Tauri system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            patchelf \
            xdg-utils

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Build Tauri bundle and upload to draft release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          args: ${{ matrix.args }}
          retryAttempts: 3